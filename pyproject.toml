[project]
name = "s2-ltae-unet"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"s2_download.py" = ["F401"]
"compute_dnbr.py" = ["E402"]
"compute_fire_progression.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
